<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Critério Tech — Vitrine Oficial de Duelos | ZenosTech</title>
  <script>
    if (location.hostname.includes('zenostech.com.br') && !location.pathname.endsWith('/')) {
      const base = document.createElement('base');
      base.href = 'https://oliveiira-renan-21.github.io/criterio-tech/';
      document.head.appendChild(base);
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -0.02em;
    }
    .apple-bento {
      background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .apple-badge-pro {
      background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
      color: #09090b;
    }
    .apple-badge-value {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      color: #052e16;
    }
  </style>
</head>
<body class="bg-[#09090B] text-zinc-100 antialiased min-h-screen">
  <main class="max-w-6xl mx-auto p-6 md:p-10 flex flex-col gap-8">

    <!-- Header & Search Bar -->
    <header class="flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-white/10 pb-8">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-semibold text-zinc-300 mb-3">
          <span>⚡ ZenosTech Labs</span>
          <span>•</span>
          <span class="text-emerald-400">Preços Verificados Hoje</span>
        </div>
        <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight">
          Critério Tech — Vitrine Oficial de Duelos
        </h1>
        <p class="text-sm text-zinc-400 mt-1">
          Digite o código do vídeo (ex: <strong>#042</strong>) ou nome do produto para acessar os links oficiais com menor preço.
        </p>
      </div>

      <div class="w-full md:w-80">
        <label class="block text-xs text-zinc-400 font-semibold mb-1.5">Busca Rápida por Código ou Produto:</label>
        <input id="searchInput" type="text" placeholder="Ex: #042, Logitech, Mouse..." class="w-full bg-zinc-900 border border-white/20 rounded-2xl px-4 py-3 text-sm font-bold text-white focus:outline-none focus:border-white" />
      </div>
    </header>

    <!-- Duels List Container -->
    <div id="duelsContainer" class="flex flex-col gap-8"></div>

  </main>

  <script>
    const FALLBACK_DUELS = [
      {
        duelCode: "#042",
        category: "Periféricos Sem Fio",
        technicalWinner: {
          name: "Logitech G Pro X Superlight 2",
          shortName: "G Pro X2",
          priceBRL: 889,
          originalPriceBRL: 1099,
          rating: 4.9,
          imageUrl: "./assets/winner-1.png",
          angle2Url: "./assets/winner-2.png",
          angle2Label: "Kit Pro X",
          verdictSummary: "O melhor sensor do mundo (HERO 2 44.000 DPI), switches ópticos híbridos, 95h de bateria e 2 anos de garantia no Brasil.",
          highlights: [
            { label: "Sensor", value: "HERO 2 (44K)" },
            { label: "Bateria / Modo", value: "95h • 4K Hz 🏆" },
            { label: "Peso Físico", value: "60 Gramas" }
          ],
          amazonUrl: "https://www.amazon.com.br/dp/B0CJ9RGJ18?tag=criteriotech-20",
          mercadoLivreUrl: "https://lista.mercadolivre.com.br/logitech-g-pro-x-superlight-2?matt_tool=70133169&matt_word=rj20261108182619164"
        },
        rationalChoice: {
          name: "Attack Shark X3 Pro (PAW3395)",
          shortName: "Shark X3 Pro",
          priceBRL: 239,
          originalPriceBRL: 349,
          rating: 4.8,
          imageUrl: "./assets/rational-1.png",
          angle2Url: "./assets/rational-2.png",
          angle2Label: "Vista Topo",
          verdictSummary: "Entrega 94% da performance competitiva com o sensor topo de linha PAW3395, pesando apenas 49g por um quarto do valor.",
          highlights: [
            { label: "Sensor", value: "PAW3395 (26K)" },
            { label: "Bateria / Modo", value: "65h • Tri-Mode" },
            { label: "Peso Físico", value: "Só 49g 🏆" }
          ],
          amazonUrl: "https://www.amazon.com.br/dp/B0FXBJ8GNV?tag=criteriotech-20",
          mercadoLivreUrl: "https://lista.mercadolivre.com.br/mouse-gamer-attack-shark-x3?matt_tool=70133169&matt_word=rj20261108182619164"
        }
      }
    ];

    let allDuels = FALLBACK_DUELS;

    function switchSiteAngle(imgId, newSrc, clickedBtn) {
      const imgEl = document.getElementById(imgId);
      if (imgEl) imgEl.src = newSrc;
      const buttons = clickedBtn.parentElement.querySelectorAll('button');
      buttons.forEach(btn => {
        if (btn === clickedBtn) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-zinc-900 text-white text-[10px] font-bold cursor-pointer transition shadow-sm';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg bg-white text-zinc-800 hover:bg-zinc-300 text-[10px] font-bold cursor-pointer transition';
        }
      });
    }

    function renderDuels(filterText = '') {
      const q = filterText.trim().toLowerCase();
      const filtered = allDuels.filter(d =>
        !q ||
        d.duelCode.toLowerCase().includes(q) ||
        d.category.toLowerCase().includes(q) ||
        d.technicalWinner.name.toLowerCase().includes(q) ||
        d.rationalChoice.name.toLowerCase().includes(q)
      );

      const container = document.getElementById('duelsContainer');
      container.innerHTML = filtered.map((duel, dIdx) => {
        const savings = duel.technicalWinner.priceBRL - duel.rationalChoice.priceBRL;
        return `
          <article class="rounded-3xl bg-zinc-900/70 border border-white/15 p-6 md:p-8 flex flex-col gap-6">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <span class="px-3.5 py-1.5 rounded-xl bg-white text-zinc-950 font-black text-sm">DUELO ${duel.duelCode}</span>
                <div>
                  <div class="text-xs text-zinc-400 font-semibold uppercase">${duel.category}</div>
                  <h2 class="text-lg font-black text-white">${duel.technicalWinner.name} vs. ${duel.rationalChoice.name}</h2>
                </div>
              </div>
              <span class="text-xs text-emerald-400 font-semibold bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                ✓ Estoque e Menor Preço Confirmados
              </span>
            </div>

            <!-- Grid Lock Simétrico (Alinhamento Horizontal Travado) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
              ${[duel.technicalWinner, duel.rationalChoice].map((item, idx) => {
                const isWinner = idx === 0;
                const imgId = `duel-${dIdx}-item-${idx}`;
                return `
                  <div class="apple-bento rounded-3xl p-6 flex flex-col h-full ${isWinner ? '' : 'border-emerald-500/40'}">
                    <div class="flex items-center justify-between h-7 mb-3">
                      <span class="${isWinner ? 'apple-badge-pro' : 'apple-badge-value'} text-xs font-black px-3 py-1 rounded-full">
                        ${isWinner ? '🏆 VENCEDOR TÉCNICO (MELHOR GERAL)' : `⚡ ESCOLHA RACIONAL (ECONOMIZE R$ ${savings})`}
                      </span>
                      <span class="text-xs font-bold text-amber-400">★★★★★ ${item.rating || '4.9'}</span>
                    </div>

                    <div class="h-52 w-full bg-white rounded-2xl my-2 shrink-0 relative flex items-center justify-center p-4 overflow-hidden">
                      ${item.imageUrl
                        ? `<img id="${imgId}" src="${item.imageUrl}" alt="${item.name}" class="max-h-44 w-auto object-contain transition-transform duration-300 hover:scale-105" />`
                        : `<span class="text-2xl font-black text-zinc-900">${item.shortName}</span>`
                      }
                      ${item.angle2Url ? `
                        <div class="absolute bottom-2.5 right-2.5 flex items-center gap-1 bg-zinc-200/80 backdrop-blur-sm p-1 rounded-xl">
                          <button onclick="switchSiteAngle('${imgId}', '${item.imageUrl}', this)" class="px-2.5 py-1 rounded-lg bg-zinc-900 text-white text-[10px] font-bold cursor-pointer transition shadow-sm">Perfil</button>
                          <button onclick="switchSiteAngle('${imgId}', '${item.angle2Url}', this)" class="px-2.5 py-1 rounded-lg bg-white text-zinc-800 hover:bg-zinc-300 text-[10px] font-bold cursor-pointer transition">${item.angle2Label || 'Ângulo 2'}</button>
                        </div>
                      ` : ''}
                    </div>

                    <h3 class="text-xl font-black text-white mt-3 h-7 truncate">${item.name}</h3>

                    <p class="text-xs text-zinc-400 mt-1.5 leading-5 line-clamp-2 h-[40px]">
                      ${item.verdictSummary}
                    </p>

                    <div class="grid grid-cols-3 gap-2 mt-4 text-center">
                      ${item.highlights.slice(0, 3).map(h => `
                        <div class="bg-zinc-950/90 border border-white/10 rounded-xl p-2.5 flex flex-col justify-center h-[60px]">
                          <div class="text-[11px] text-zinc-400 font-medium">${h.label}</div>
                          <div class="text-xs font-black ${isWinner ? 'text-white' : 'text-emerald-400'} mt-0.5">${h.value}</div>
                        </div>
                      `).join('')}
                    </div>

                    <div class="border-t border-white/10 pt-4 mt-5">
                      <div class="flex items-baseline justify-between h-8 mb-3">
                        <div>
                          ${item.originalPriceBRL ? `<span class="text-xs text-zinc-400 line-through mr-2">R$ ${item.originalPriceBRL}</span>` : ''}
                          <span class="text-2xl font-black ${isWinner ? 'text-white' : 'text-emerald-400'}">R$ ${item.priceBRL}</span>
                        </div>
                        <span class="text-xs text-emerald-400 font-bold">Menor Preço Verificado</span>
                      </div>
                      <div class="grid grid-cols-2 gap-2.5">
                        <a href="${item.amazonUrl}" target="_blank" rel="noopener sponsored" class="py-3 px-4 rounded-2xl bg-amber-400 hover:bg-amber-300 text-zinc-950 font-black text-xs text-center transition shadow-lg">
                          🛒 Ver na Amazon
                        </a>
                        <a href="${item.mercadoLivreUrl}" target="_blank" rel="noopener sponsored" class="py-3 px-4 rounded-2xl bg-yellow-300 hover:bg-yellow-200 text-zinc-950 font-black text-xs text-center transition shadow-lg">
                          ⚡ Mercado Livre
                        </a>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderDuels(e.target.value);
    });

    renderDuels();

    fetch('./duels.json')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          allDuels = data;
          renderDuels(document.getElementById('searchInput').value);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
